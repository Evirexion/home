# Mide la velocidad de bicyrekkord.com (solo lectura: no cambia nada del sitio).
# Guarda los resultados en la rama bicyrekkord-reportes.
name: Bicyrekkord velocidad

on:
  workflow_dispatch:
  push:
    branches: [bicyrekkord-web]
    paths:
      - '.github/workflows/bicyrekkord-velocidad.yml'
      - '.github/medir-velocidad.txt'

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tiempos de respuesta del servidor y encabezados
        continue-on-error: true
        run: |
          set +e
          mkdir -p r
          medir() { curl -s -o /dev/null -m 150 -w "$1\tcode=%{http_code}\tdns=%{time_namelookup}\tconnect=%{time_connect}\ttls=%{time_appconnect}\tttfb=%{time_starttransfer}\ttotal=%{time_total}\tsize=%{size_download}\tip=%{remote_ip}\n" "$1" >> r/tiempos.tsv; }
          # Archivos estáticos (no pasan por WordPress) vs páginas de WordPress
          for i in 1 2 3; do
            medir https://www.bicyrekkord.com/wp-includes/css/dashicons.min.css
            medir https://www.bicyrekkord.com/wp-includes/js/jquery/jquery.min.js
            medir https://www.bicyrekkord.com/
            medir https://www.bicyrekkord.com/tienda/
            medir https://www.bicyrekkord.com/producto/bornera-5-terminales/
            medir "https://www.bicyrekkord.com/?nocache=$RANDOM"
          done
          medir http://bicyrekkord.com/
          curl -s -D r/headers-home.txt -o r/home.html -m 150 https://www.bicyrekkord.com/
          curl -s -D r/headers-css.txt -o /dev/null -m 150 https://www.bicyrekkord.com/wp-includes/css/dashicons.min.css
          (getent hosts www.bicyrekkord.com; getent hosts bicyrekkord.com) > r/dns.txt
          for ip in $(getent hosts www.bicyrekkord.com | awk '{print $1}' | head -2); do curl -s -m 20 "https://ipinfo.io/$ip/json" >> r/dns.txt; done
          curl -s -m 30 "https://dns.google/resolve?name=bicyrekkord.com&type=NS" >> r/dns.txt
      - name: Lighthouse (celular y computador)
        continue-on-error: true
        run: |
          for u in "https://www.bicyrekkord.com/" "https://www.bicyrekkord.com/tienda/" "https://www.bicyrekkord.com/producto/bornera-5-terminales/"; do
            n=$(echo "$u" | sed -E 's#https://www.bicyrekkord.com/##; s#/$##; s#/#-#g'); n=${n:-inicio}
            npx --yes lighthouse@12 "$u" --quiet --only-categories=performance --output=json --output-path="r/lh-movil-$n.json" --chrome-flags="--headless=new --no-sandbox" --max-wait-for-load=150000 || true
          done
          npx --yes lighthouse@12 "https://www.bicyrekkord.com/" --quiet --preset=desktop --only-categories=performance --output=json --output-path="r/lh-pc-inicio.json" --chrome-flags="--headless=new --no-sandbox" --max-wait-for-load=150000 || true
      - name: Guardar resultados
        run: |
          cd r && for f in lh-*.json; do [ -f "$f" ] && gzip -9 "$f"; done; cd ..
          git init -q out && cd out
          git checkout -q -b bicyrekkord-reportes
          mkdir -p velocidad && cp -r ../r/* velocidad/
          git add -A && git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Medición de velocidad bicyrekkord.com $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" bicyrekkord-reportes
