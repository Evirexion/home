# Publica SOLO la demostración de Bicyrekkord (Worker "bicyrekkord-dev" en workers.dev).
# No construye ni publica evirexion.com. Solo corre en la rama bicyrekkord-web.
name: Bicyrekkord demo (dev)

on:
  push:
    branches: [bicyrekkord-web]
    paths:
      - 'bicyrekkord/**'
      - '.github/workflows/bicyrekkord-dev.yml'
  workflow_dispatch:

concurrency:
  group: bicyrekkord-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir ZIP del tema, plugin y demo
        working-directory: bicyrekkord
        run: |
          ./build.sh
          cp dist/bicyrekkord.zip dist/brk-operaciones.zip dist/brk-demo.zip dev-site/public/
          curl -fL -o dev-site/public/woocommerce.zip https://github.com/woocommerce/woocommerce/releases/download/11.2.1/woocommerce.zip
      - name: Revisar la llave de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID"
          echo "::notice::Longitud del Account ID: ${#CLOUDFLARE_ACCOUNT_ID} (debe ser 32)"
          R=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')
          echo "::notice::Verificación de la llave: $R"
          R2=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -c '{success, subdomain: .result.subdomain, errors: [.errors[]?.message]}')
          echo "::notice::Subdominio workers.dev: $R2"
      - name: Publicar en Cloudflare (bicyrekkord-dev)
        working-directory: bicyrekkord/dev-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            echo "::notice::Publicado en $URL"
          else
            grep -iE "error|✘|authentication|permission|code:" deploy.log | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
